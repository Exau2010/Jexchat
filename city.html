<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#1d3550">
<title>JexCity</title>
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/city.css">
<!-- Three.js r160 (MIT) : copie locale à la racine (aucun CDN). Les add-ons (GLTFLoader, BufferGeometryUtils) sont aussi à la racine. -->
<script type="importmap">{"imports":{"three":"/three.module.min.js","three/addons/":"/"}}</script>
<!-- Chargement en parallèle : tous les modules sont demandés dès l'ouverture (au lieu d'une cascade module → import → import). -->
<link rel="modulepreload" href="/three.module.min.js">
<link rel="modulepreload" href="/city-main.js">
<link rel="modulepreload" href="/city-geo.js">
<link rel="modulepreload" href="/city-world.js">
<link rel="modulepreload" href="/city-textures.js">
<link rel="modulepreload" href="/city-controls.js">
<link rel="modulepreload" href="/city-avatar.js">
<link rel="modulepreload" href="/city-social.js">
<link rel="modulepreload" href="/city-posts.js">
<link rel="modulepreload" href="/city-ui.js">
<link rel="modulepreload" href="/city-media.js">
<link rel="modulepreload" href="/city-games.js">
<link rel="modulepreload" href="/city-solo.js">
<link rel="modulepreload" href="/city-look.js">
<link rel="modulepreload" href="/city-api.js">
<script defer src="/socket.io/socket.io.js"></script>
<script>
// Les deux appels de démarrage partent tout de suite, pendant le téléchargement des modules (city-api.js les réutilise une seule fois).
(function () { var e = window.__jexEarly = {}; try { ['/api/auth/me', '/api/city/config'].forEach(function (u) { e[u] = fetch(u, { credentials: 'same-origin' }); e[u].catch(function () {}); }); } catch (_) {} })();
</script>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="Ville 3D JexCity"></canvas>

<div id="hud" hidden>
  <a id="b-home" class="fab" href="/" aria-label="Retour à JexChat" data-ic="back"></a>
  <div id="hud-right">
    <button class="fab" data-act="search" aria-label="Rechercher" data-ic="search"></button>
    <button class="fab" data-act="map" aria-label="Carte de la ville" data-ic="map"></button>
    <button class="fab" data-act="phone" aria-label="Téléphone" data-ic="phone"></button>
    <button class="fab" data-act="notifs" aria-label="Notifications" data-ic="bell"><span class="badge" id="notif-badge" hidden></span></button>
    <button class="fab" data-act="settings" aria-label="Réglages" data-ic="gear"></button>
  </div>
  <button id="mood-chip" aria-label="Mon humeur">Dire quelque chose…</button>
  <div id="hint">Touchez le sol pour marcher</div>
  <div id="campad">glisser ici<br>pour tourner</div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<aside id="sheet" hidden role="dialog" aria-modal="false">
  <header><button class="fab" id="sheet-back" aria-label="Retour" data-ic="back" hidden></button><b id="sheet-title"></b><button class="fab" id="sheet-close" aria-label="Fermer" data-ic="close"></button></header>
  <div id="sheet-body"></div>
</aside>

<div id="loader"><div class="ld-title">JexCity</div><div class="ld-sub" id="ld-msg">Chargement de la ville…</div><div class="ld-bar"><i></i></div></div>
<div id="fatal" hidden><div class="ld-title">JexCity</div><div class="ld-sub" id="fatal-msg"></div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn primary" id="fatal-retry">Réessayer</button><a class="btn" id="fatal-home" href="/">Retour à JexChat</a></div></div>

<script type="module" src="/city-main.js"></script>
</body>
</html>
