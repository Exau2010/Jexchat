<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEXCHAT — Messages</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    @media (max-width: 768px) {
      .mobile-only { display: flex !important; }
      .desktop-only { display: none !important; }
    }
    @media (min-width: 769px) {
      .mobile-only { display: none !important; }
    }
  </style>
</head>
<body data-page="messages">

  <!-- Socket.IO -->
  <script src="/socket.io/socket.io.js"></script>

  <div class="app-layout">

    <!-- ─── Sidebar ─────────────────────────────────────────────────────── -->
    <aside class="sidebar" id="sidebar">

      <!-- Header -->
      <div class="sidebar-header" id="sidebar-header" style="position:relative">
        <div class="sidebar-brand">
          <img src="logo.png" alt="" class="sidebar-brand-mark">
          <span class="sidebar-brand-text">JEXCHAT</span>
        </div>
        <div class="sidebar-actions">
          <button class="btn-icon" id="notif-btn" title="Notifications" style="position:relative">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
            </svg>
            <span class="badge badge-error hidden" id="notif-badge" style="position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;font-size:0.625rem"></span>
          </button>
          <button class="btn-icon" id="new-group-btn" title="Créer un groupe">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
            </svg>
          </button>
          <button class="btn-icon" id="settings-btn" title="Paramètres">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Search -->
      <div class="search-bar">
        <div class="search-input-wrap">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/>
            <path stroke-linecap="round" d="M21 21l-4.35-4.35"/>
          </svg>
          <input type="search" class="search-input" id="search-input" placeholder="Rechercher..." autocomplete="off" spellcheck="false">
        </div>
      </div>

      <!-- Online Users Strip -->
      <div class="online-strip">
        <div class="online-strip-label">En ligne</div>
        <div class="online-list" id="online-list">
          <div class="flex items-center" style="gap:12px;padding:4px 0">
            <div class="skeleton" style="width:40px;height:40px;border-radius:50%"></div>
            <div class="skeleton" style="width:40px;height:40px;border-radius:50%"></div>
            <div class="skeleton" style="width:40px;height:40px;border-radius:50%"></div>
          </div>
        </div>
      </div>

      <!-- Conversations -->
      <div class="conv-list" id="conv-list">
        <div style="padding:16px">
          <div class="skeleton" style="height:60px;border-radius:12px;margin-bottom:8px"></div>
          <div class="skeleton" style="height:60px;border-radius:12px;margin-bottom:8px"></div>
          <div class="skeleton" style="height:60px;border-radius:12px"></div>
        </div>
      </div>

    </aside>

    <!-- ─── Chat Area ───────────────────────────────────────────────────── -->
    <main class="chat-area" id="chat-area" style="flex-direction:column">

      <!-- Chat Header -->
      <div class="chat-header" id="chat-header" style="display:none"></div>

      <!-- Chat Messages Wrap -->
      <div class="chat-messages-wrap" id="chat-messages-wrap" style="display:none">
        <div class="chat-bg" id="chat-bg"></div>
        <div class="chat-messages" id="messages-container"></div>
      </div>

      <!-- Typing Indicator -->
      <div class="typing-indicator hidden" id="typing-indicator" style="padding:8px 24px">
        <div class="typing-dots">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
        <span class="typing-name" style="font-size:0.8125rem;color:var(--color-text-secondary)"></span>
        <span style="font-size:0.8125rem;color:var(--color-text-secondary)"> est en train d'écrire...</span>
      </div>

      <!-- Chat Input Area -->
      <div class="chat-input-area" id="chat-input-area" style="display:none">
        <!-- Reply Preview -->
        <div id="reply-preview" class="reply-preview hidden">
          <div class="reply-preview-content">
            <div class="reply-preview-name"></div>
            <div class="reply-preview-text"></div>
          </div>
          <button class="reply-cancel" id="reply-cancel">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <!-- Input Row -->
        <div class="chat-input-row">
          <button class="btn-icon attach-btn" id="attach-btn" title="Joindre un média">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
            </svg>
          </button>

          <div class="chat-input-wrap">
            <textarea
              class="chat-textarea"
              id="chat-textarea"
              placeholder="Écrire un message..."
              rows="1"
              maxlength="4000"
              spellcheck="true"
              autocomplete="off"
            ></textarea>
          </div>

          <button class="send-btn" id="send-btn" title="Envoyer">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Placeholder (shown by JS on desktop when no conv selected) -->
      <div id="chat-placeholder-default" class="chat-placeholder" style="flex:1;display:flex">
        <div class="chat-placeholder-icon">
          <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="color:var(--color-primary)">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.86 9.86 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
          </svg>
        </div>
        <h2>Bienvenue sur JEXCHAT</h2>
        <p>Sélectionnez une conversation ou recherchez un utilisateur pour commencer à discuter</p>
      </div>

    </main>

  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="script.js"></script>
  <script>
    // Show chat UI when conv is opened
    const origOpenConversation = window.openConversation;

    // Reveal hidden chat elements when a conversation is opened
    function revealChatArea() {
      document.getElementById('chat-header').style.display = 'flex';
      document.getElementById('chat-messages-wrap').style.display = 'block';
      document.getElementById('chat-input-area').style.display = 'block';
      document.getElementById('chat-placeholder-default')?.remove();
    }

    // Patch openConversation to show elements
    document.addEventListener('DOMContentLoaded', () => {
      // We need to observe when chat-header gets content
      const observer = new MutationObserver(() => {
        if (document.getElementById('chat-header').children.length > 0) {
          revealChatArea();
        }
      });
      observer.observe(document.getElementById('chat-header'), { childList: true });
    });
  </script>

</body>
</html>
